name: aegisflow

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: aegisflow-api

    ports:
      - "8000:8000"

    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/aegisflow

      REDIS_HOST: redis
      REDIS_PORT: 6379

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    restart: unless-stopped


  postgres:
    image: postgres:16-alpine

    container_name: aegisflow-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aegisflow

    ports:
      - "9451:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d aegisflow"
        ]

      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  redis:
    image: redis:7-alpine

    container_name: aegisflow-redis-compose

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped


volumes:

  postgres_data:
    external: true
    name: aegisflown_postgres_data

  redis_data:
    external: true
    name: aegisflown_redis_data